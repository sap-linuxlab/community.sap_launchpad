---
# This task attempts dry run to check SAPCAR file in order to validate provided credentials.

- name: SAP Software Download - Validate Credentials - Python env - Dry run to check user credentials and download privilege
  when: sap_software_download_use_venv | d(true)
  community.sap_launchpad.software_center_download:
    suser_id: "{{ sap_software_download_suser_id }}"
    suser_password: "{{ sap_software_download_suser_password }}"
    search_query: "SAPCAR"
    dest: "{{ sap_software_download_directory }}"
    search_alternatives: true
    deduplicate: "last"
    dry_run: true
  register: __sap_software_download_register_validate_credentials_venv
  retries: 1
  delay: 5
  environment:
    PATH: "{{ __sap_software_download_fact_venv_path }}"
    PYTHONPATH: "{{ __sap_software_download_fact_venv_pythonpath }}"
    VIRTUAL_ENV: "{{ __sap_software_download_register_temp_venv.path }}"
  vars:
    ansible_python_interpreter: "{{ __sap_software_download_fact_python_interpreter_path }}"
  ignore_errors: true  # Errors are ignored and validated afterwards


- name: SAP Software Download - Validate Credentials - Default Python - Dry run to check user credentials and download privilege
  when: not sap_software_download_use_venv | d(true)
  community.sap_launchpad.software_center_download:
    suser_id: "{{ sap_software_download_suser_id }}"
    suser_password: "{{ sap_software_download_suser_password }}"
    search_query: "SAPCAR"
    dest: "{{ sap_software_download_directory }}"
    search_alternatives: true
    deduplicate: "last"
    dry_run: true
  register: __sap_software_download_register_validate_credentials_default
  retries: 1
  delay: 5
  vars:
    ansible_python_interpreter: "{{ __sap_software_download_fact_python_interpreter_path }}"
  ignore_errors: true  # Errors are ignored and validated afterwards


- name: SAP Software Download - Validate Credentials - Fail if credentials are not valid
  ansible.builtin.fail:
    msg: |
      FAIL: Validation of provided S-User credentials failed.
      Ensure correct S-User credentials are provided in the variables:
      - 'sap_software_download_suser_id'
      - 'sap_software_download_suser_password'
  when:
    - __sap_software_download_register_validate_credentials_venv.failed | d(false)
      or __sap_software_download_register_validate_credentials_default.failed | d(false)
