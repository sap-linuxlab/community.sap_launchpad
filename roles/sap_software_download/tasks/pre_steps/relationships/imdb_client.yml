---

# HANA 1: IMDB_CLIENT100_120_140-10009663.SAR
# - IMDB_CLIENT100 - HANA 2.0 identifier
#
# HANA 2: IMDB_CLIENT20_028_22-80002082.SAR (SAP HANA Client 2.28.22)
# - IMDB_CLIENT20 - HANA 2.0 identifier


# Update existing fact dictionary with component details appending to 'server' details.
# '__sap_software_download_fact_hana_client_original' is set for later reuse, when we update this dictionary.
- name: SAP Software Download - Relationship Validation - Set fact with parsed IMDB_CLIENT file version details
  ansible.builtin.set_fact:
    __sap_software_download_fact_hana_components: >-
      {{ __sap_software_download_fact_hana_components | combine({
        'client': __imdb_client_details
      }, recursive=True) }}

    # Save original file name to use when replacing in the list.
    __sap_software_download_fact_hana_client_original: "{{ __sap_software_download_fact_hana_component_names['client'] }}"
  vars:
    __imdb_client_details:
      filename: "{{ __sap_software_download_fact_hana_component_names['client'] }}"

      # Extract HANA version from file name based on prefix, e.g. 1 or 2
      version:
        "{{ '1' if __sap_software_download_fact_hana_component_names['client'].startswith('IMDB_CLIENT1')
          else '2' }}"

      # IMDB_CLIENT does not use revision versioning similar to other IMDB components.
      revision: ""

      # IMDB_CLIENT does not use patch versioning similar to other IMDB components.
      patch: ""

      # Extract File ID from file name, e.g. IMDB_CLIENT20_028_22-80002082.SAR -> 80002082
      file_id: "{{ __sap_software_download_fact_hana_component_names['client'].split('-')[1].split('.')[0] | d('') }}"

      # Defines search type. Updated if alternative or update search is successful.
      source: exact

# Validate wildcard format if wildcard is present in filename
# This is validated inside of module, but we do it here to fail faster and avoid unnecessary API calls.
- name: SAP Software Download - Relationship Validation - Validate wildcard format in IMDB_CLIENT filename
  ansible.builtin.fail:
    msg: |
      FAIL: Invalid wildcard format in IMDB_CLIENT filename.

      Filename: {{ __sap_software_download_fact_hana_component_names['client'] }}

      Wildcard queries must follow specific format:
      Format: "PREFIX*-ID.EXT" where:
       - PREFIX must have at least one character before wildcard
       - Wildcard (*) must be in PREFIX position only
       - Single dash (-) separates prefix and ID
       - ID must be exactly 8 digits
       - Extension must be letters only

      Valid examples:
       - "IMDB_CLIENT20*-80001894.SAR"
       - "IMDB_CLIENT100*-10012328.SAR"

      Invalid examples:
       - "*-80001894.SAR" (no prefix - too broad)
       - "IMDB_CLIENT20-*.SAR" (wildcard in ID position)
       - "IMDB_CLIENT20*X-80001894.SAR" (extra characters after wildcard)
       - "IMDB_CLIENT20*-7000.SAR" (ID must be 8 digits, not 4)
  when:
    - "'*' in __sap_software_download_fact_hana_component_names['client']"
    - __sap_software_download_fact_hana_component_names['client'] is not match('^[^-]+\\*-\\d{8}\\.[a-zA-Z]+$')

# NOTE: IMDB_CLIENT does not share FILE_ID between HANA 1.0 and 2.0 so upgrade search is not possible!
- name: SAP Software Download - Relationship Validation - Fail if IMDB_CLIENT is for wrong HANA version
  ansible.builtin.fail:
    msg: |
      FAIL: IMDB_CLIENT file is for different SAP HANA version than IMDB_SERVER.

      {{ __sap_software_download_fact_hana_component_names['server'] }} details:
      Version: {{ __sap_software_download_fact_hana_components['server']['version'] }}

      {{ __sap_software_download_fact_hana_component_names['client'] }} details:
      Version: {{ __sap_software_download_fact_hana_components['client']['version'] }}

      Please provide correct IMDB_CLIENT file for the detected IMDB_SERVER version.
  when: __sap_software_download_fact_hana_components['server']['version']
        != __sap_software_download_fact_hana_components['client']['version']


- name: SAP Software Download - Relationship Validation - Check availability of IMDB_CLIENT file using dry run
  community.sap_launchpad.software_center_download:
    suser_id: "{{ sap_software_download_suser_id }}"
    suser_password: "{{ sap_software_download_suser_password }}"
    search_query: "{{ __sap_software_download_fact_hana_component_names['client'] }}"
    dest: "{{ sap_software_download_directory }}"
    search_alternatives: true
    search_upgrades: false
    deduplicate: "{{ sap_software_download_deduplicate }}"
    dry_run: true
  register: __sap_software_download_register_imdb_client_dry_run
  retries: 1
  until: __sap_software_download_register_imdb_client_dry_run is not failed
  environment: "{{ __venv_environment if sap_software_download_use_venv | d(true) else {} }}"
  vars:
    ansible_python_interpreter: "{{ __sap_software_download_fact_python_interpreter_path }}"
    __venv_environment:
      PATH: "{{ __sap_software_download_fact_venv_path }}"
      PYTHONPATH: "{{ __sap_software_download_fact_venv_pythonpath }}"
      VIRTUAL_ENV: "{{ __sap_software_download_register_temp_venv.path }}"
  when: sap_software_download_find_alternatives | d(true)
  ignore_errors: true  # Errors are ignored and validated afterwards.

# Fail if file cannot be found even with alternative search.
- name: SAP Software Download - Relationship Validation - Fail if IMDB_CLIENT file was not found
  ansible.builtin.fail:
    msg: |
      FAIL: Relationship validation failed because IMDB_CLIENT file was not found.
      Original file: {{ __sap_software_download_fact_hana_client_original }}
      Set the variable 'sap_software_download_upgrade_relationships' to 'true',
      to allow searching for upgrade candidate if original file was not found.
  when:
    - __sap_software_download_register_imdb_client_dry_run is failed
    - not sap_software_download_upgrade_relationships | d(false)


# Alternative file was found so we have to update component dictionary and file name list.
# This can happen only if wildcard was used, as otherwise search is strict and looks for exact file name.
- name: Block for successful dry run with alternative
  when:
    - __sap_software_download_register_imdb_client_dry_run is not failed
    - __sap_software_download_register_imdb_client_dry_run.alternative | d(false)
  block:
    - name: SAP Software Download - Relationship Validation - Set fact with updated IMDB_CLIENT name if alternative was found
      ansible.builtin.set_fact:
        __sap_software_download_fact_hana_component_names: >-
          {{ __sap_software_download_fact_hana_component_names
            | combine({'client': __sap_software_download_register_imdb_client_dry_run['filename']}) }}

    - name: SAP Software Download - Relationship Validation - Set fact with re-parsed IMDB_CLIENT details after alternative search
      ansible.builtin.set_fact:
        __sap_software_download_fact_hana_components: >-
          {{ __sap_software_download_fact_hana_components | combine({
            'client': __imdb_client_details
          }, recursive=True) }}
      vars:
        __imdb_client_details:
          filename: "{{ __sap_software_download_fact_hana_component_names['client'] }}"
          version:
            "{{ '1' if __sap_software_download_fact_hana_component_names['client'].startswith('IMDB_CLIENT1')
              else '2' }}"
          revision: "{{ __sap_software_download_fact_hana_component_names['client'].split('_')[2] }}"
          patch: "{{ __sap_software_download_fact_hana_component_names['client'].split('_')[3].split('-')[0] }}"
          file_id: "{{ __sap_software_download_fact_hana_component_names['client'].split('-')[1].split('.')[0] }}"
          source: alternative
      when: not __sap_software_download_register_imdb_client_dry_run.failed

    - name: SAP Software Download - Relationship Validation - Set fact with updated file list with resolved IMDB_CLIENT filename
      ansible.builtin.set_fact:
        __sap_software_download_files: >-
          {{ __sap_software_download_files
            | map('replace', __sap_software_download_fact_hana_client_original, __sap_software_download_fact_hana_component_names['client'])
            | list }}


# Prepare validation regex in following format (e.g. IMDB_CLIENT20_028_22-80002082.SAR):
# - IMDB_CLIENT1 or IMDB_CLIENT2 based on HANA version
# - File ID must match the one extracted from the file name (e.g. 80001894)
# - NOTE: Revision and patch level are not validated as they are not comparable with IMDB_SERVER!
- name: SAP Software Download - Relationship Validation - Set fact with regex to validate IMDB_CLIENT file version
  ansible.builtin.set_fact:
    # NOTE: We are using regex because matching revision and patch levels to IMDB_SERVER is not possible.

    # Query to be used when dry_run fails.
    __sap_software_download_fact_hana_client_search_query:
      "{{ __prefix }}*-{{ __file_id }}.SAR"
  vars:
    __prefix: "IMDB_CLIENT{{ '100' if __sap_software_download_fact_hana_components['server']['version'] == '1' else '20' }}"
    __file_id: "{{ __sap_software_download_fact_hana_components['client']['file_id'] }}"


- name: Block for download of upgrade candidate for IMDB_CLIENT
  when:
    - sap_software_download_upgrade_relationships | d(false)
    - __sap_software_download_register_imdb_client_dry_run is failed
  block:
    # Search is not using 'search_upgrades', because we use wildcard regex to get correct HANA version.
    - name: SAP Software Download - Relationship Validation - Retry failed IMDB_CLIENT with IMDB_SERVER revision
      community.sap_launchpad.software_center_download:
        suser_id: "{{ sap_software_download_suser_id }}"
        suser_password: "{{ sap_software_download_suser_password }}"
        search_query: "{{ __sap_software_download_fact_hana_client_search_query }}"
        dest: "{{ sap_software_download_directory }}"
        search_alternatives: true
        search_upgrades: false
        deduplicate: "last"  # We search for latest upgrade.
        dry_run: true
      register: __sap_software_download_register_imdb_client_retry
      retries: 1
      until: __sap_software_download_register_imdb_client_retry is not failed
      environment: "{{ __venv_environment if sap_software_download_use_venv | d(true) else {} }}"
      vars:
        ansible_python_interpreter: "{{ __sap_software_download_fact_python_interpreter_path }}"
        __venv_environment:
          PATH: "{{ __sap_software_download_fact_venv_path }}"
          PYTHONPATH: "{{ __sap_software_download_fact_venv_pythonpath }}"
          VIRTUAL_ENV: "{{ __sap_software_download_register_temp_venv.path }}"
      ignore_errors: true

    - name: SAP Software Download - Relationship Validation - Fail if upgrade candidate for IMDB_CLIENT file was not found
      ansible.builtin.fail:
        msg: |
          FAIL: Relationship validation failed because no upgrade candidate for IMDB_CLIENT file was found.
          Original file: {{ __sap_software_download_fact_hana_client_original }}
          Upgrade candidate searched with query: {{ __sap_software_download_register_imdb_client_retry['original_query'] }}
          No upgrade candidate found with 'search_upgrades' enabled.
      when: __sap_software_download_register_imdb_client_retry.failed


    # Update existing fact dictionary with new file name details.
    # This replaces filename and we use '__sap_software_download_fact_hana_client_original' when required.
    - name: SAP Software Download - Relationship Validation - Set fact with parsed IMDB_CLIENT file version details after retry
      ansible.builtin.set_fact:
        __sap_software_download_fact_hana_components: >-
          {{ __sap_software_download_fact_hana_components | combine({
            'client': __imdb_client_details
          }, recursive=True) }}
      vars:
        __imdb_client_details:
          filename: "{{ __sap_software_download_register_imdb_client_retry['filename'] }}"
          version:
            "{{ '1' if __sap_software_download_register_imdb_client_retry['filename'].startswith('IMDB_CLIENT100')
              else '2' }}"
          revision: "{{ __sap_software_download_register_imdb_client_retry['filename'].split('_')[2] }}"
          patch: "{{ __sap_software_download_register_imdb_client_retry['filename'].split('_')[3].split('-')[0] }}"
          file_id: "{{ __sap_software_download_register_imdb_client_retry['filename'].split('-')[1].split('.')[0] }}"
          source: upgrade
      when: not __sap_software_download_register_imdb_client_retry.failed

    - name: SAP Software Download - Relationship Validation - Set fact with updated software list with new IMDB_CLIENT file name after upgrade search
      ansible.builtin.set_fact:
        __sap_software_download_files: >-
          {{ __sap_software_download_files
          | map('replace', __sap_software_download_fact_hana_client_original, __sap_software_download_register_imdb_client_retry['filename'])
          | list }}
      when: not __sap_software_download_register_imdb_client_retry.failed

    # Must be run last to avoid block conditional skipping tasks.
    - name: SAP Software Download - Relationship Validation - Set fact with updated IMDB_CLIENT name if upgrade was found
      ansible.builtin.set_fact:
        __sap_software_download_fact_hana_component_names: >-
          {{ __sap_software_download_fact_hana_component_names
            | combine({'client': __sap_software_download_register_imdb_client_retry['filename']}) }}

# NOTE: Task to compare revision and patch is not required for client because,
# wrong HANA version would fail already and upgrade uses preset prefix forcing correct HANA version.

- name: SAP Software Download - Relationship Validation - Show summary of IMDB_CLIENT validation
  ansible.builtin.debug:
    msg: |
      IMDB_CLIENT file successfully validated against IMDB_SERVER.
      {% if __sap_software_download_fact_hana_components['client']['source'] == 'alternative' %}
      Original IMDB_CLIENT file '{{ __sap_software_download_fact_hana_client_original }}' was not found,
      but alternative file '{{ __sap_software_download_fact_hana_components['client']['filename'] }}' was found.
      {% elif __sap_software_download_fact_hana_components['client']['source'] == 'upgrade' %}
      Original IMDB_CLIENT file '{{ __sap_software_download_fact_hana_client_original }}' was not found,
      but an upgrade file '{{ __sap_software_download_fact_hana_components['client']['filename'] }}' was found.
      {% else %}
      Original IMDB_CLIENT file '{{ __sap_software_download_fact_hana_client_original }}' was found.
      {% endif %}

      {{ __sap_software_download_fact_hana_component_names['server'] }} details:
      Revision: {{ __sap_software_download_fact_hana_components['server']['revision'] }}
      Patch: {{ __sap_software_download_fact_hana_components['server']['patch'] }}
      Version: {{ __sap_software_download_fact_hana_components['server']['version'] }}

      {{ __sap_software_download_fact_hana_component_names['client'] }} details:
      Version: {{ __sap_software_download_fact_hana_components['client']['version'] }}
