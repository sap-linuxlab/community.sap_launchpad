---

# HANA 1: IMDB_AFL100_122P_3500-10012328.SAR (SAP HANA AFL 1.0 Revision 122.3500 only for HANA DB 122.35)
# - IMDB_AFL100 - HANA 1.0 identifier
# - 122 - Revision 122 (contains SPS level, e.g. SPS12)
# - 3500 - Patch level 35
# NOTE: Latest HANA 1.0 revision is 122.35.
#
# HANA 2: IMDB_AFL20_089P_300-80001894.SAR (SAP HANA AFL Rev 89.300 only for HANA 2.0 Rev 89.03)
# - IMDB_AFL20 - HANA 2.0 identifier
# - 089 - Revision 89 (contains SPS level, e.g. SPS08)
# - 300 - Patch level 3

# Update existing fact dictionary with component details appending to 'server' details.
# '__sap_software_download_fact_hana_afl_original' is set for later reuse, when we update this dictionary.
- name: SAP Software Download - Relationship Validation - Set fact with parsed IMDB_AFL file version details
  ansible.builtin.set_fact:
    __sap_software_download_fact_hana_components: >-
      {{ __sap_software_download_fact_hana_components | combine({
        'afl': __imdb_afl_details
      }, recursive=True) }}

    # Save original file name to use when replacing in the list.
    __sap_software_download_fact_hana_afl_original: "{{ __sap_software_download_fact_hana_component_names['afl'] }}"
  vars:
    __imdb_afl_details:
      filename: "{{ __sap_software_download_fact_hana_component_names['afl'] }}"

      # Extract HANA version from file name based on prefix, e.g. 1 or 2
      version:
        "{{ '1' if __sap_software_download_fact_hana_component_names['afl'].startswith('IMDB_AFL1')
          else '2' }}"

      # Extract revision from file name, e.g. IMDB_AFL20_089P_300-80001894.SAR -> 089
      revision: "{{ __sap_software_download_fact_hana_component_names['afl'].split('_')[2] | d('') }}"

      # Extract patch level from file name, e.g. IMDB_AFL20_089P_300-80001894.SAR -> 300
      patch: "{{ __sap_software_download_fact_hana_component_names['afl'].split('_')[3].split('-')[0] | d('') }}"

      # Extract File ID from file name, e.g. IMDB_AFL20_089P_300-80001894.SAR -> 80001894
      file_id: "{{ __sap_software_download_fact_hana_component_names['afl'].split('-')[1].split('.')[0] | d('') }}"

# Validate wildcard format if wildcard is present in filename
# This is validated inside of module, but we do it here to fail faster and avoid unnecessary API calls.
- name: SAP Software Download - Relationship Validation - Validate wildcard format in IMDB_AFL filename
  ansible.builtin.fail:
    msg: |
      FAIL: Invalid wildcard format in IMDB_AFL filename.

      Filename: {{ __sap_software_download_fact_hana_component_names['afl'] }}

      Wildcard queries must follow specific format:
      Format: "PREFIX*-ID.EXT" where:
       - PREFIX must have at least one character before wildcard
       - Wildcard (*) must be in PREFIX position only
       - Single dash (-) separates prefix and ID
       - ID must be exactly 8 digits
       - Extension must be letters only

      Valid examples:
       - "IMDB_AFL20*-80001894.SAR"
       - "IMDB_AFL100*-10012328.SAR"

      Invalid examples:
       - "*-80001894.SAR" (no prefix - too broad)
       - "IMDB_AFL20-*.SAR" (wildcard in ID position)
       - "IMDB_AFL20*X-80001894.SAR" (extra characters after wildcard)
       - "IMDB_AFL20*-7000.SAR" (ID must be 8 digits, not 4)
  when:
    - "'*' in __sap_software_download_fact_hana_component_names['afl']"
    - __sap_software_download_fact_hana_component_names['afl'] is not match('^[^-]+\\*-\\d{8}\\.[a-zA-Z]+$')


# Prepare validation regex in following format:
# - IMDB_AFL100 or IMDB_AFL20 based on HANA version
# - Revision must match IMDB_SERVER revision (e.g. 089)
# - Patch level must match IMDB_SERVER patch level (e.g. 3)
#   and allow for up to two additional digits to cover bugfix patches (e.g. 301, 302 etc.)
# - File ID must match the one extracted from the file name (e.g. 80001894)
- name: SAP Software Download - Relationship Validation - Set fact with regex to validate IMDB_AFL file version
  ansible.builtin.set_fact:
    __sap_software_download_fact_hana_afl_regex:
      "(?i)^{{ __prefix }}_{{ __rev }}P?_{{ __patch }}(\\d{2})?-{{ __file_id }}\\.SAR$"

    # Query to be used when regex fails
    __sap_software_download_fact_hana_afl_search_query:
      "{{ __prefix }}_{{ __rev }}*-{{ __file_id }}.SAR"
  vars:
    __prefix: "IMDB_AFL{{ '100' if __sap_software_download_fact_hana_components['server']['version'] == '1' else '20' }}"
    __rev: "{{ __sap_software_download_fact_hana_components['server']['revision'] }}"
    __patch: "{{ __sap_software_download_fact_hana_components['server']['patch'] }}"
    __file_id: "{{ __sap_software_download_fact_hana_components['afl']['file_id'] }}"


# We do not execute dry_run with original file name,
# instead we use regex to determine if alternative search is required.
- name: Block for download of upgrade candidate for IMDB_AFL
  when:
    - sap_software_download_upgrade_relationships | d(false)
    - __sap_software_download_fact_hana_component_names['afl']
      is not match(__sap_software_download_fact_hana_afl_regex)
  block:
    # Since we are using regex, it will attempt to find file based on IMDB_SERVER version,
    # resulting in HANA 2.0 files when AFL is for HANA 1.0.
    - name: SAP Software Download - Relationship Validation - Inform about difference in files for SAP HANA 1.0 to 2.0
      ansible.builtin.debug:
        msg: |
          INFO: Different SAP HANA version was detected between IMDB_SERVER and IMDB_AFL files.
          The variable 'sap_software_download_upgrade_relationships' is set to 'true',
          so the Ansible Role will attempt to search for upgrade candidate based on IMDB_SERVER revision and patch level.

          {{ __sap_software_download_fact_hana_component_names['server'] }} details:
          Version: {{ __sap_software_download_fact_hana_components['server']['version'] }}

          {{ __sap_software_download_fact_hana_component_names['afl'] }} details:
          Version: {{ __sap_software_download_fact_hana_components['afl']['version'] }}
      when: __sap_software_download_fact_hana_components['server']['version']
            != __sap_software_download_fact_hana_components['afl']['version']


    # Search is not using 'search_upgrades', because we use wildcard regex to get correct revision.
    # Patch is not included in query because wildcard search will return latest with deduplicate 'last'.
    - name: SAP Software Download - Relationship Validation - Retry failed IMDB_AFL with IMDB_SERVER revision
      community.sap_launchpad.software_center_download:
        suser_id: "{{ sap_software_download_suser_id }}"
        suser_password: "{{ sap_software_download_suser_password }}"
        search_query: "{{ __sap_software_download_fact_hana_afl_search_query }}"
        dest: "{{ sap_software_download_directory }}"
        search_alternatives: true
        search_upgrades: false
        deduplicate: "last"  # We search for latest upgrade.
        dry_run: true
      register: __sap_software_download_register_imdb_afl_retry
      retries: 1
      until: __sap_software_download_register_imdb_afl_retry is not failed
      environment: "{{ __venv_environment if sap_software_download_use_venv | d(true) else {} }}"
      vars:
        ansible_python_interpreter: "{{ __sap_software_download_fact_python_interpreter_path }}"
        __venv_environment:
          PATH: "{{ __sap_software_download_fact_venv_path }}"
          PYTHONPATH: "{{ __sap_software_download_fact_venv_pythonpath }}"
          VIRTUAL_ENV: "{{ __sap_software_download_register_temp_venv.path }}"
      ignore_errors: true

    - name: SAP Software Download - Relationship Validation - Fail if upgrade candidate for IMDB_AFL file was not found
      ansible.builtin.fail:
        msg: |
          FAIL: Relationship validation failed because no upgrade candidate for IMDB_AFL file was found.
          Original file: {{ __sap_software_download_fact_hana_afl_original }}
          Upgrade candidate searched with query: {{ __sap_software_download_register_imdb_afl_retry['original_query'] }}
          No upgrade candidate found with 'search_upgrades' enabled.
      when: __sap_software_download_register_imdb_afl_retry.failed


    # Update existing fact dictionary with new file name details.
    # This replaces filename and we use '__sap_software_download_fact_hana_afl_original' when required.
    - name: SAP Software Download - Relationship Validation - Set fact with parsed IMDB_AFL file version details after retry
      ansible.builtin.set_fact:
        __sap_software_download_fact_hana_components: >-
          {{ __sap_software_download_fact_hana_components | combine({
            'afl': __imdb_afl_details
          }, recursive=True) }}
      vars:
        __imdb_afl_details:
          filename: "{{ __sap_software_download_register_imdb_afl_retry['filename'] }}"

          # Extract HANA version from file name based on prefix, e.g. 1 or 2
          version:
            "{{ '1' if __sap_software_download_register_imdb_afl_retry['filename'].startswith('IMDB_AFL100')
              else '2' }}"

          # Extract revision from file name, e.g. IMDB_AFL20_089P_300-80001894.SAR -> 089
          revision: "{{ __sap_software_download_register_imdb_afl_retry['filename'].split('_')[2] }}"

          # Extract patch level from file name, e.g. IMDB_AFL20_089P_300-80001894.SAR -> 300
          patch: "{{ __sap_software_download_register_imdb_afl_retry['filename'].split('_')[3].split('-')[0] }}"

          # Extract File ID from file name, e.g. IMDB_AFL20_089P_300-80001894.SAR -> 80001894
          file_id: "{{ __sap_software_download_register_imdb_afl_retry['filename'].split('-')[1].split('.')[0] }}"
      when: not __sap_software_download_register_imdb_afl_retry.failed

    - name: SAP Software Download - Relationship Validation - Set fact with updated software list with new IMDB_AFL file name after upgrade search
      ansible.builtin.set_fact:
        __sap_software_download_files: >-
          {{ __sap_software_download_files
          | map('replace', __sap_software_download_fact_hana_afl_original, __sap_software_download_register_imdb_afl_retry['filename'])
          | list }}
      when: not __sap_software_download_register_imdb_afl_retry.failed

    # Must be run last to avoid block conditional skipping tasks
    - name: SAP Software Download - Relationship Validation - Set fact with update name of IMDB_AFL
      ansible.builtin.set_fact:
        __sap_software_download_fact_hana_component_names: >-
          {{ __sap_software_download_fact_hana_component_names
            | combine({'afl': __sap_software_download_register_imdb_afl_retry['filename']}) }}


- name: SAP Software Download -  Relationship Validation - Fail if IMDB_AFL version is not compatible with IMDB_SERVER version
  ansible.builtin.fail:
    msg: |
      FAIL: IMDB_AFL version is not compatible with IMDB_SERVER version!

      {{ __sap_software_download_fact_hana_component_names['server'] }} details:
      Revision: {{ __sap_software_download_fact_hana_components['server']['revision'] }}
      Patch: {{ __sap_software_download_fact_hana_components['server']['patch'] }}

      {{ __sap_software_download_fact_hana_component_names['afl'] }} details:
      Revision: {{ __sap_software_download_fact_hana_components['afl']['revision'] }}
      Patch: {{ __sap_software_download_fact_hana_components['afl']['patch'] }}

      Validation was performed using regex: {{ __sap_software_download_fact_hana_afl_regex }}
  ignore_errors: "{{ sap_software_download_ignore_relationship_warning | d(false) }}"
  when: __sap_software_download_fact_hana_component_names['afl'] is not match(__sap_software_download_fact_hana_afl_regex)


- name: SAP Software Download - Relationship Validation - Show summary of IMDB_AFL validation
  ansible.builtin.debug:
    msg: |
      IMDB_AFL file successfully validated against IMDB_SERVER.
      {% if __sap_software_download_fact_hana_afl_original is not match(__sap_software_download_fact_hana_afl_regex) %}
      Original file '{{ __sap_software_download_fact_hana_afl_original }}' was not found,
      but alternative file '{{ __sap_software_download_fact_hana_components['afl']['filename'] }}' was found.
      {% else %}
      Original file '{{ __sap_software_download_fact_hana_afl_original }}' was found.
      {% endif %}

      {{ __sap_software_download_fact_hana_component_names['server'] }} details:
      Revision: {{ __sap_software_download_fact_hana_components['server']['revision'] }}
      Patch: {{ __sap_software_download_fact_hana_components['server']['patch'] }}

      {{ __sap_software_download_fact_hana_component_names['afl'] }} details:
      Revision: {{ __sap_software_download_fact_hana_components['afl']['revision'] }}
      Patch: {{ __sap_software_download_fact_hana_components['afl']['patch'] }}
