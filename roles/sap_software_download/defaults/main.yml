---

### Mandatory variables

# The SAP S-User ID with download authorization for SAP software (String).
sap_software_download_suser_id: ''

# The password for the SAP S-User specified in 'sap_software_download_suser_id' (String).
sap_software_download_suser_password: ''

# A list of SAP software file names to download (List of Strings).
sap_software_download_files: []

# The name or display ID of a transaction from the SAP Maintenance Planner (String).
# If provided, the role will download all files associated with this Maintenance Plan transaction.
sap_software_download_mp_transaction: ''

# Enables download of Maintenance Plan Stack XML file together with files (Boolean).
# Used only when 'sap_software_download_mp_transaction' is provided.
# If set to 'false', Stack XML file will not be downloaded.
sap_software_download_mp_stack_xml: true


### Optional variables for controlling the download process

# Enables searching for alternative files if the requested file is not found (Boolean).
# Only applies to files specified in 'sap_software_download_files'.
# If set to 'false', the role will not search for alternatives.
sap_software_download_find_alternatives: true

# The directory where downloaded SAP software files will be stored (String).
# It will be created if it does not exist. Must be an absolute path.
sap_software_download_directory: '/software'

# Determines whether to ignore errors when a requested file is not found (Boolean).
# If set to 'true', the role will continue execution and download other files, even if some files are not found.
# If set to 'false', the role will fail if any requested file is not found.
sap_software_download_ignore_file_not_found: false

# Determines whether to ignore errors when a specified Maintenance Plan transaction is not found (Boolean).
# If set to 'true' and a Maintenance Plan is not found, the role will continue execution,
# downloading any files specified in 'sap_software_download_files'.
# If set to 'false', the role will fail if the specified Maintenance Plan is not found.
sap_software_download_ignore_plan_not_found: false

# Enables validation of relationships between SAP software files (Boolean).
# Only applies to files specified in 'sap_software_download_files', not Maintenance Plan files.
# If set to 'false', no relationship validation will be performed.
# Example: Verify version of IMDB_LCAPPS against IMDB_SERVER if IMDB_SERVER was found.
# NOTE: This option will result in longer execution time
# when 'sap_software_download_find_alternatives' is set to 'true',
# because it attempts download in Dry run to gather list of alternative files for validation.
sap_software_download_validate_relationships: true

# Enables automatic upgrade of related HANA components when SERVER version changes.
# Only applies when 'sap_software_download_validate_relationships: true'.
# If IMDB_SERVER is not found and 'search_upgrades' finds a newer revision,
# all related components (AFL, LCAPPS) will be searched with matching revision.
# Example: If SERVER 084 is removed and only available revision is 089,
# then AFL/LCAPPS will search for 089* revisions.
# WARNING: This does not guarantee installation compatibility due to SAP's
# inconsistent versioning (filename vs. actual package version).
# Recommended to test before production use.
sap_software_download_upgrade_relationships: false

# Determines whether to ignore warnings during file relationship validation (Boolean).
# If set to 'true', the role will continue execution even if there are warnings during the validation of file relationships.
# If set to 'false', the role will fail if any warnings are encountered during file relationship validation.
sap_software_download_ignore_relationship_warning: false

# Determines whether to ignore validate credentials task (Boolean).
# Disabling this check can lead to locked account, if password is incorrect.
# If set to 'true', the role will continue execution without validating S-User credentials.
# If set to 'false', the role will execute dry run to validate S-User credentials.
sap_software_download_ignore_validate_credentials: false

# Specifies how to handle duplicate file results when using 'sap_software_download_files' (String).
# If multiple files with the same name are found, this setting determines which one to download.
# - 'first': Download the first file found (generally oldest).
# - 'last': Download the last file found (generally newest).
# - '': No deduplication, will cause an error if multiple files with the same name are found.
sap_software_download_deduplicate: last

# Enables checksum validation of existing files present in 'sap_software_download_directory' (Boolean).
# This does not affect automatic checksum validation of downloaded files.
sap_software_download_validate_checksum: false


### Python environment variables

# Determines whether to execute the role within a Python virtual environment (Boolean).
# Using a virtual environment is strongly recommended to isolate dependencies.
# If set to 'false', the role will install Python dependencies directly into the system's Python environment.
sap_software_download_use_venv: true

# The Python interpreter executable to use when creating a Python virtual environment (String).
# Mandatory when the variable 'sap_software_download_use_venv' is set to 'true'.
# This is the name of the Python executable (e.g., 'python3.11', 'python3.9'), which may differ from the Python package name.
# The default value is determined by the operating system and is set in the corresponding OS-specific variables file.
# Examples:
# - SLES 15 SP7: 'python3.11'
# - RHEL 8:  'python3.9'
# sap_software_download_python_interpreter: ''

# The name of the OS package that provides the desired Python version (String).
# The Python version provided by this package must match the version specified by 'sap_software_download_python_interpreter'.
# The default value is determined by the operating system and is set in the corresponding OS-specific variables file.
# Examples:
# - SLES 15 SP7: 'python311'
# - RHEL 8:  'python3.9'
# sap_software_download_python_package: ''

# The list of the OS packages that provide modules for the desired Python version (List of Strings).
# Required modules: wheel, urllib3, requests, beautifulsoup4, lxml
# The listed package versions must match the Python version specified by 'sap_software_download_python_interpreter'.
# The default value is determined by the operating system and is set in the corresponding OS-specific variables file.
# Examples:
# - SLES 15 SP7: 'python311-wheel', 'python311-urllib3', 'python311-requests', 'python311-beautifulsoup4', 'python311-lxml'
# - RHEL 8: 'python3.9-wheel', 'python3.9-urllib3', 'python3.9-requests', 'python3.9-beautifulsoup4', 'python3.9-lxml'
# sap_software_download_python_module_packages: []
